[project]
name = "discrecontinual-equations"
version = "0.1.0"
description = ""
authors = [
    {name = "snoodleboot, LLC",email = "john@snoodleboot.com"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.11.9,<3.0.0)",
    "plotly (>=6.3.1,<7.0.0)",
    "kaleido (>=1.1.0,<2.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.0,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "sweet-tea>=0.2.63,<1.0.0",
    "pytest-cov",
]

[project.optional-dependencies]
dev = ["pytest-cov"]


[tool.pytest.ini_options]
# A plain "pytest" runs the PR gate. Timing tests measure the clock, which other work on
# the machine moves; they run only with "pytest -m timing" (DEQ-47, DEQ-87). Slow tests are
# integration studies (order slopes over many sizes, film builds, long manifold growth);
# the nightly workflow runs them, and "pytest -m slow" runs them locally (DEQ-144).
# Coverage runs only in the nightly workflow; add --cov to measure it locally.
addopts = "-m 'not slow and not timing'"
markers = [
    "timing: measures wall or CPU time; deselected unless run with -m timing",
    "slow: integration study kept out of the PR gate; run nightly and with -m slow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
# Same floor as requires-python and ruff, so black parses and formats identically on 3.13 (CI) and 3.14 (local)
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
files = ["discrecontinual_equations"]

# plotly ships neither a py.typed marker nor a stubs package
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

# scipy ships no py.typed; scipy-stubs exists but rejects the open branches' sparse calls
# (bmat, splu) on overloads, so adopting it is its own change
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# Baseline of type errors that predate mypy running against the installed project in CI
# (DEQ-64). Each entry disables only the codes that module already reports, so new code
# elsewhere is fully checked. Remove an entry when its module is fixed.

# Solvers read their own config's fields (step_size, tolerances, times) through
# `solver_config`, which is typed as the base SolverConfig; the ensemble and coefficients
# call the stochastic methods through a plain Function
[[tool.mypy.overrides]]
module = [
    "discrecontinual_equations.solver.deterministic.euler.euler_solver",
    "discrecontinual_equations.solver.stochastic.coefficients",
    "discrecontinual_equations.solver.stochastic.ensemble",
    "discrecontinual_equations.solver.stochastic.euler_maruyama.euler_maruyama_solver",
    "discrecontinual_equations.solver.stochastic.gottwald_melbourne.gottwald_melbourne_solver",
    "discrecontinual_equations.solver.stochastic.milstein.milstein_solver",
    "discrecontinual_equations.solver.stochastic.zhan_duan_li_li.zhan_duan_li_li_solver",
]
disable_error_code = ["attr-defined"]

# As above, and `solution` is assigned on a subclass of a __slots__ class
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.solver.stochastic.runge_kutta"]
disable_error_code = ["attr-defined", "misc"]

# Parameter.value is `float | None` and is read inside eval() without a None check
[[tool.mypy.overrides]]
module = [
    "discrecontinual_equations.simple_ode_function",
    "discrecontinual_equations.systems.coupled_ring",
]
disable_error_code = ["operator"]

# Name-mangled class attributes are set in __init_subclass__
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.parameter"]
disable_error_code = ["attr-defined"]

# One list type holds both flat and nested points, and list comprehensions are run for
# their appends
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.curve"]
disable_error_code = ["arg-type", "assignment", "func-returns-value", "return-value"]

# Jet arithmetic is typed against numbers.Number, which declares no operators
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.jet"]
disable_error_code = ["operator"]

# Functions typed for floats are evaluated on Jets and Multivariates (automatic
# differentiation), and residuals are decoded through the ResidualFunction base type
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.center_manifold"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.codim2"]
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.codim2_builder"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.codim3"]
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.codim3_builder"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.derivative_provider"]
disable_error_code = ["arg-type", "call-overload"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.focal"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.manifold"]
disable_error_code = ["arg-type", "attr-defined"]

# Plain str and int arguments reach Literal-typed config fields
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.exploration"]
disable_error_code = ["arg-type", "misc"]

# The refined orbit is annotated as the base class but is the adaptive one, which takes
# warm_start; periods are `float | None` until solved
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.periodic_orbit"]
disable_error_code = ["arg-type", "call-arg"]

# _function and _mesh are __slots__ assigned outside __init__
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.connecting_orbit"]
disable_error_code = ["attr-defined", "has-type"]

# A branch is stored where a Curve is declared
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.continuer"]
disable_error_code = ["assignment"]

# A grid index tuple holds numpy integers where Sequence[int] is declared
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.continuation.fokker_planck"]
disable_error_code = ["arg-type"]

# Renderers narrow render()'s Scene argument; scenes and their parts are typed as object;
# solve_ivp event attributes and optional callables are untyped
[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.report"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.scene_builder"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.stage"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.stage_builder"]
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.stage_renderer"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.stochastic_stage_builder"]
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = ["discrecontinual_equations.webplot.stochastic_stage_renderer"]
disable_error_code = ["override", "var-annotated"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Enable pycodestyle (`E`) codes and Pyflakes (`F`) codes by default
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "YTT",  # flake8-2020
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C90",  # McCabe complexity
    "DJ",   # flake8-django
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # NumPy-specific rules
    "AIR",  # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
]

exclude = [
    "**/__pycache__",
    "**/__pycache__/**",
]

ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Allow Greek characters in mathematical docstrings
    "RUF002",
    # Allow imports from typing
    "TCH001", "TCH002", "TCH003",
    # Allow `sys.version` and `sys.version_info`
    "YTT101", "YTT102", "YTT103",
    # Allow `raise NotImplementedError`
    "F901",
    # Conflicts with black, which drops the trailing comma when a bracket's body fits on one line
    "COM812",
    # Greek letters and math symbols (α, σ, ×, −) in strings and comments, as RUF002 for docstrings
    "RUF001", "RUF003",
    # Exceptions carry their message inline, `raise ValueError("...")`, throughout the library
    "EM101", "TRY003",
    # A named result before `return` (h_new, y_new) mirrors the formula it implements
    "RET504",
    # PLR0913 already bounds the argument count, and is what long numerical signatures
    # carry a reasoned `# noqa: PLR0913` for; PLR0917 would ask for a second one
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, imports, and print diagnostics
"tests/**/*" = ["PLR2004", "S101", "TID252", "T20"]
# unittest.TestCase-style tests use self.assert*
"tests/{test_variable,test_parameter}.py" = ["PT009"]
# Commented-out alternative test setups kept for reference
"tests/test_euler_solver.py" = ["ERA001"]
# Test systems implement the Function interface and ignore `time`
"tests/{test_function,test_plot}.py" = ["ARG002"]
"tests/solver/{gottwald_melbourne,zhan_duan_li_li}/**/*" = ["ARG002"]
# Library: implements the Function interface and ignores `time`
"discrecontinual_equations/simple_ode_function.py" = ["ARG002"]
# Library: `h` keeps the adaptive solvers' `_accept_step` signature uniform; the multistep
# start-up counts steps by hand and branches on step 2; long lines as below
"discrecontinual_equations/solver/deterministic/**/*" = ["ARG002", "SIM113", "PLR2004", "E501"]
# Library: the α ∈ (1, 2) stability range is the method's definition, not a magic number
"discrecontinual_equations/solver/stochastic/gottwald_melbourne/**/*" = ["PLR2004", "SIM108"]
# Library: `dW` is the Wiener-increment notation of the method's paper
"discrecontinual_equations/solver/stochastic/zhan_duan_li_li/**/*" = ["N803", "N806", "PLR0913"]
# Library: plots build plotly kwargs with dict(), use os.path, import lazily, and print where they saved
"discrecontinual_equations/plot/**/*" = ["C408", "PTH", "PLC0415", "T20", "ERA001"]
# Long lines black cannot split (strings, comments, dotted imports) that predate this config;
# newer code marks each one with `# noqa: E501` instead
"discrecontinual_equations/{curve,parameter}.py" = ["E501"]
"discrecontinual_equations/solver/stochastic/{euler_maruyama,gottwald_melbourne,zhan_duan_li_li}/*_{solver,config}.py" = ["E501"]
"tests/solver/{adams_bashforth2,adams_bashforth3,dormand_prince,prince_dormand87,euler_maruyama,gottwald_melbourne,milstein,zhan_duan_li_li}/test_*_solver.py" = ["E501"]
"tests/solver/test_ensemble.py" = ["E501"]
# Standalone scripts from the first release, not library code: unused `time` in Function
# implementations, os.path, dict() kwargs, long main()s, no __init__.py, shebangs without +x
"examples/{brownian_motion,ccefs,complex_ode_system,geometric_brownian_motion,lorenz,quartic,thaler,zhan_duan_li_li}/**/*" = [
    "ARG002", "PTH", "C408", "ERA001", "INP001", "EXE001", "PLR0913", "PLR0915",
    "PLR2004", "N806", "NPY002", "RUF015", "E501",
]
# Examples can use print statements and imports
"examples/**/*" = ["T20", "TID252"]
# Docs can use print statements
"docs/**/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["discrecontinual_equations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "black==26.10.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "mypy==2.4.1",
    "pymdown-extensions>=10.19.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.6",
]
